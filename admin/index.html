<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin SIKANEON Giveaway</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:20px}
.wrap{max-width:1000px;margin:auto}
h1{color:#ffd21c}
.card{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin-top:20px}
.count{font-size:28px;font-weight:bold;color:#ffd21c}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:12px;border-bottom:1px solid #292929;text-align:left}
th{color:#ffd21c}
a{color:#ffd21c}
.empty{text-align:center;color:#888;padding:30px}
button{background:#ffd21c;border:0;border-radius:10px;padding:10px 16px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>⚡ ADMIN SIKANEON</h1>
<p>Panel peserta SIKANEON Giveaway</p>

<div class="card">
<div>Total Peserta</div>
<div class="count" id="count">0</div>
<button onclick="loadData()">↻ Refresh</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>#</th>
<th>Username</th>
<th>Link VT</th>
<th>Alasan</th>
<th>Waktu</th>
</tr>
</thead>
<tbody id="list">
<tr><td colspan="5" class="empty">Belum ada data</td></tr>
</tbody>
</table>
</div>
</div>

<script>
async function loadData(){
try{
const r=await fetch("data.json?"+Date.now());
const data=await r.json();
document.getElementById("count").textContent=data.length;
const list=document.getElementById("list");

if(!data.length){
list.innerHTML='<tr><td colspan="5" class="empty">Belum ada peserta</td></tr>';
return;
}

list.innerHTML=data.map((x,i)=>`
<tr>
<td>${i+1}</td>
<td>${escapeHtml(x.username)}</td>
<td><a href="${escapeAttr(x.link)}" target="_blank">Buka VT</a></td>
<td>${escapeHtml(x.reason)}</td>
<td>${escapeHtml(x.time)}</td>
</tr>`).join("");
}catch(e){
document.getElementById("list").innerHTML=
'<tr><td colspan="5" class="empty">Data belum tersedia</td></tr>';
}
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[m]));
}

function escapeAttr(s){
return String(s).replace(/"/g,"&quot;");
}

loadData();
</script>
</body>
</html>
